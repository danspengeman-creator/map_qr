<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Michelle Amy Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
    color: #111111;
  }
  body {
    box-sizing: border-box;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    /* border on all sides, respecting notches and home bar */
    padding:
      max(24px, env(safe-area-inset-top))
      max(10px, env(safe-area-inset-right))
      max(24px, env(safe-area-inset-bottom))
      max(10px, env(safe-area-inset-left));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  h1 {
    margin: 0;
    flex: 0 0 auto;
    font-family: "Dancing Script", "Snell Roundhand", "Segoe Script", "Brush Script MT", cursive;
    font-size: 8vw; /* starting size, refined by the script below */
    font-weight: 600;
    text-align: center;
    line-height: 1.15;
    white-space: nowrap;
    width: 100%;
  }
  .dl {
    flex: 0 0 auto;
    margin: -4px 0 0;
    font-size: 0.8rem;
    color: #555555;
    text-decoration: underline;
    text-align: center;
  }
  .url {
    margin: 0;
    flex: 0 0 auto;
    font-size: clamp(1rem, 5vw, 1.4rem);
    text-align: center;
    word-break: break-all;
  }
  .qr-wrap {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-wrap img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
  }
</style>
</head>
<body>
  <h1 id="title">Michelle Amy Photography</h1>
  <div class="qr-wrap">
    <img src="qr.png" alt="QR code for Michelle Amy Photography">
  </div>
  <a class="dl" href="qr.png" download="Michelle-Amy-Photography-QR.png">Bad service area? Download QR locally</a>
  <p class="url">spengeman.com/map_qr</p>

<script>
  // Scales the heading so it always fits on one line.
  function fitTitle() {
    var h = document.getElementById('title');
    h.style.fontSize = '100px';
    h.style.width = 'auto';
    var natural = h.scrollWidth;
    var avail = h.parentElement.clientWidth
      - parseFloat(getComputedStyle(h.parentElement).paddingLeft)
      - parseFloat(getComputedStyle(h.parentElement).paddingRight);
    h.style.width = '100%';
    h.style.fontSize = Math.min(100 * avail / natural, 64) + 'px';
  }
  fitTitle();
  window.addEventListener('resize', fitTitle);
  window.addEventListener('orientationchange', fitTitle);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fitTitle); }

  // Keeps the screen from dimming or locking while this page is open.
  // Note: web pages cannot change screen brightness. This only prevents auto-dim.
  let lock = null;
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible') {
        lock = await navigator.wakeLock.request('screen');
      }
    } catch (e) { /* ignore */ }
  }
  keepAwake();
  document.addEventListener('visibilitychange', keepAwake);
  document.addEventListener('click', keepAwake);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
